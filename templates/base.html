{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title%} Expense Tracker {% endblock%}</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <header class="site-header">
        <a class="site-brand" href="{% url 'dashboard' %}">Expense Tracker</a>

        <nav class="site-nav" aria-label="Navegación principal">
            <a href="{% url 'listar_categorias' %}">Categorias</a>
            <a href="{% url 'listar_gastos' %}">Gastos</a>
            <a href="{% url 'dashboard' %}">Dashboard</a>
        </nav>

        <form method="POST" action="{% url 'logout' %}" class="nav-logout-form">
            {% csrf_token %}
            <button type="submit" class="nav-logout-button">Logout</button>
        </form>
    </header>
    <main>
        {% block content%}
        {%endblock%}
    </main>

    <footer> 
        <p> Proyecto practica Django </p>
    </footer>
</body>
</html>
